name: sentinel-sensors

services:
  suricata-update:
    image: jasonish/suricata:latest
    volumes:
      - suricata-rules:/var/lib/suricata/rules
    command: ["suricata-update"]

  suricata:
    image: jasonish/suricata:latest
    container_name: sentinel-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - /opt/sentinel/sensor-logs/suricata:/var/log/suricata
      - suricata-rules:/var/lib/suricata/rules
    command: ["-i", "${SENSOR_INTERFACE}"]
    depends_on:
      suricata-update:
        condition: service_completed_successfully

  zeek:
    image: zeek/zeek:latest
    container_name: sentinel-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /opt/sentinel/sensor-logs/zeek:/logs
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    working_dir: /logs
    command: ["zeek", "-i", "${SENSOR_INTERFACE}", "local.zeek", "LogAscii::use_json=T"]

volumes:
  suricata-rules:
