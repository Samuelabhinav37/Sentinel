title: Sentinel Sensor Container Stopped, Killed, or Removed
id: 2c4db1c0-f46e-42f4-8532-51c5548cdccb
status: experimental
description: >
  Detects the docker CLI being used to stop, kill, or remove one of this
  project's own Linux telemetry sensor containers (auditbeat, Suricata,
  Zeek) — the actual defense-impairment path in this environment, since
  auditbeat runs as a Docker container talking directly to the kernel audit
  interface rather than as a native auditd service (there is no auditctl
  binary or systemd auditd unit on this host to target). Linux analog of
  the Defender-disabled rule, retargeted to how this specific sensor is
  actually deployed rather than the generic auditctl/systemctl form.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Sentinel
date: 2026-08-16
tags:
  - attack.defense-impairment
  - attack.t1562.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_image:
    Image|endswith: '/docker'
  selection_action:
    CommandLine|contains:
      - 'stop'
      - 'kill'
      - 'rm'
  selection_target:
    CommandLine|contains:
      - 'sentinel-auditbeat'
      - 'sentinel-suricata'
      - 'sentinel-zeek'
  condition: all of selection_*
falsepositives:
  - Legitimate maintenance (a compose redeploy, a manual sensor restart) stopping the container intentionally
level: high
