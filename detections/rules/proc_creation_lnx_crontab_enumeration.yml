title: Crontab Enumeration
id: 403ed92c-b7ec-4edd-9947-5b535ee12d46
status: experimental
description: >
  Detects usage of crontab -l to list the current user's scheduled tasks,
  a common reconnaissance step. Adapted from SigmaHQ (rules/linux/
  process_creation/proc_creation_lnx_crontab_enumeration.yml).
references:
  - https://attack.mitre.org/techniques/T1007/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_crontab_enumeration.yml
author: Joseliyo Sanchez (SigmaHQ); adapted by Sentinel
date: 2026-08-17
tags:
  - attack.discovery
  - attack.t1007
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/crontab'
    CommandLine|contains: ' -l'
  condition: selection
falsepositives:
  - Legitimate use of crontab
level: low
