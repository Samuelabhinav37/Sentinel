title: Scheduled Task Creation via schtasks.exe
id: 4e6b8d1a-2f5c-4b9e-a3d7-8c1f5a9e2b6d
status: experimental
description: >
  Detects use of schtasks.exe with /create to register a new scheduled task,
  a common persistence mechanism. High-signal when combined with an unusual
  parent process or a task action pointing at a script interpreter.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Sentinel
date: 2026-08-15
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains:
      - '/create'
      - '-create'
  condition: all of selection_*
falsepositives:
  - Legitimate software installers registering maintenance or update tasks
level: medium
