title: Potential Netcat Reverse Shell Execution
id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
status: experimental
description: >
  Detects execution of netcat with the -c/-e flag followed by a shell, a
  classic reverse-shell setup. Adapted from SigmaHQ (rules/linux/
  process_creation/proc_creation_lnx_netcat_reverse_shell.yml). NOTE: the
  deployed EQL matches on the invoked process name rather than the resolved
  executable path -- on Debian/Ubuntu, nc resolves via update-alternatives
  to /usr/bin/nc.openbsd, so an Image|endswith-style match on the resolved
  path silently never fires. Found via live-fire testing, see
  docs/build-log.md.
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_netcat_reverse_shell.yml
author: '@d4ns4n_, Nasreddine Bencherchali (SigmaHQ); adapted by Sentinel'
date: 2026-08-17
tags:
  - attack.execution
  - attack.command-and-control
  - attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_nc:
    Image|endswith:
      - '/nc'
      - '/ncat'
  selection_flags:
    CommandLine|contains:
      - ' -c '
      - ' -e '
  selection_shell:
    CommandLine|contains:
      - 'bash'
      - '/bin/sh'
      - 'zsh'
      - 'ksh'
      - 'csh'
      - 'ash'
  condition: all of selection_*
falsepositives:
  - Unlikely
level: high
