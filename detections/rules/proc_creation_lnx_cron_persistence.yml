title: Cron Persistence via Direct Write to Cron Directory
id: e1fb6318-60e2-4a06-8015-5a36eb999940
status: experimental
description: >
  Detects a shell command whose command line references a system cron
  directory (/etc/cron.d, /etc/cron.daily, /etc/cron.hourly,
  /etc/cron.weekly, /var/spool/cron), a common Linux persistence mechanism
  when combined with a redirect or file write. Linux analog of the
  scheduled-task-persistence rule.
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: Sentinel
date: 2026-08-16
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_shell:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
  selection_target:
    CommandLine|contains:
      - '/etc/cron.d/'
      - '/etc/cron.daily/'
      - '/etc/cron.hourly/'
      - '/etc/cron.weekly/'
      - '/var/spool/cron/'
  condition: all of selection_*
falsepositives:
  - Legitimate package installers (e.g. apt postinst scripts) writing cron.d entries during install
level: medium
