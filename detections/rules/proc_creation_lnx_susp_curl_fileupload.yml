title: Suspicious Curl File Upload - Linux
id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
status: experimental
description: >
  Detects a curl process start that adds a file to a web request, a common
  exfiltration-over-web-service pattern. Adapted from SigmaHQ (rules/linux/
  process_creation/proc_creation_lnx_susp_curl_fileupload.yml).
references:
  - https://attack.mitre.org/techniques/T1567/
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_curl_fileupload.yml
author: Nasreddine Bencherchali (Nextron Systems), Cedric MAURUGEON (SigmaHQ); adapted by Sentinel
date: 2026-08-17
tags:
  - attack.exfiltration
  - attack.command-and-control
  - attack.t1567
  - attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/curl'
  selection_cli:
    CommandLine|contains:
      - ' --form'
      - ' --upload-file '
      - ' --data '
      - ' --data-'
      - ' -F '
      - ' -T '
      - ' -d '
  filter_optional_localhost:
    CommandLine|contains:
      - '://localhost'
      - '://127.0.0.1'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
  - Scripts created by developers and admins
level: medium
