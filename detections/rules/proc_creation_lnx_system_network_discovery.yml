title: System Network Discovery - Linux
id: e7bd1cfa-b446-4c88-8afb-403bcd79e3fa
status: experimental
description: >
  Detects enumeration of local network configuration via common networking
  tools. Adapted from SigmaHQ (rules/linux/process_creation/
  proc_creation_lnx_system_network_discovery.yml) for this project's
  auditbeat-based EQL deployment.
references:
  - https://attack.mitre.org/techniques/T1016/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_system_network_discovery.yml
author: Ömer Günal and remotephone, oscd.community (SigmaHQ); adapted by Sentinel
date: 2026-08-17
tags:
  - attack.discovery
  - attack.t1016
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/firewall-cmd'
      - '/ufw'
      - '/iptables'
      - '/netstat'
      - '/ss'
      - '/ip'
      - '/ifconfig'
      - '/systemd-resolve'
      - '/route'
  selection_cli:
    CommandLine|contains: '/etc/resolv.conf'
  condition: 1 of selection_*
falsepositives:
  - Legitimate administration activities
level: informational
