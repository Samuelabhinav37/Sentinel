title: Direct Access to /etc/shadow
id: 09c0fc78-6218-43c1-97ff-d023b7fdfa6a
status: experimental
description: >
  Detects a process directly referencing /etc/shadow on its command line, a
  common way to read or copy out hashed local credentials for offline
  cracking. Linux analog of the LSASS/comsvcs dump rule.
references:
  - https://attack.mitre.org/techniques/T1003/008/
author: Sentinel
date: 2026-08-16
tags:
  - attack.credential-access
  - attack.t1003.008
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains: '/etc/shadow'
  condition: selection
falsepositives:
  - Legitimate backup/configuration-management tooling that reads /etc/shadow as root
level: high
