# Closes the detection loop: every rule in detections/rules/ should have a row here
# once it's been fired against with Atomic Red Team and observed in the SIEM.
#
# status: unvalidated | true_positive | false_positive | missed
# mttd_seconds: time from atomic execution to alert appearing in Kibana (null until measured)

- rule_id: 3d4e7b2a-9c1f-4a6e-8b2d-7f1e9a0c5d3b
  rule_file: rules/proc_creation_win_encoded_powershell.yml
  technique: T1059.001
  atomic_test: "PowerShell Command"
  status: true_positive
  mttd_seconds: null
  last_run: "2026-08-16"
  notes: "No Mordor sample and no live Windows target, so validated with a hand-built synthetic event (detections/scripts/inject_synthetic_events.py) rather than real recorded attack telemetry — weaker evidence than a Mordor replay, treat accordingly. This run also caught a real bug in the deployed rule: the EQL query used process.command_line regex~ \"(?i)...\" but Elasticsearch's EQL regex~ operator (a) requires a full-string match (^pattern$), not substring search, and the Sigma-to-EQL conversion never wraps the pattern in .*...*, and (b) doesn't support the inline (?i) case-insensitivity flag at all (Lucene automaton regex, not PCRE) — it was matched as literal text, so the rule could never have fired against real data either. regex~ is already case-insensitive on its own once the anchoring is fixed. Fixed by dropping (?i) from the Sigma source and wrapping the compiled EQL pattern with .*...* in the deployed rule; confirmed against both a lowercase and an uppercase-flag variant plus a benign negative control (no false positive)."

