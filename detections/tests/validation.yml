- rule_id: 2c4db1c0-f46e-42f4-8532-51c5548cdccb
  rule_file: rules/proc_creation_lnx_sensor_container_stopped.yml
  technique: T1562.001
  atomic_test: "Hand-run live command: docker stop sentinel-auditbeat (not from the official atomic-red-team catalog — it has no T1562.001 Linux test at all)"
  status: true_positive
  mttd_seconds: 74
  last_run: "2026-08-16"
  notes: "This rule was originally written against auditctl -e 0 / systemctl stop auditd, mirroring the Windows Defender-disabled rule's shape — but live-testing found neither auditctl nor a systemd auditd unit exists on sentinel-wazuh, because auditbeat runs as a Docker container talking directly to the kernel audit interface, not as a native auditd service. That's a real architecture gap the earlier synthetic-only validation approach would never have caught. Rewrote the rule to detect the actual defense-impairment path in this environment (docker stop/kill/rm against the project's own sensor containers), redeployed, then validated live: docker stop sentinel-auditbeat executed 20:31:24Z, alert start 20:32:37Z, then docker start sentinel-auditbeat immediately after to restore the sensor. See docs/build-log.md for the full story."

- rule_id: 09c0fc78-6218-43c1-97ff-d023b7fdfa6a
  rule_file: rules/proc_creation_lnx_shadow_file_access.yml
  technique: T1003.008
  atomic_test: "Access /etc/shadow (Local) (atomic-red-team T1003.008, GUID 3723ab77-c546-403c-8fb4-bb577033b235)"
  status: true_positive
  mttd_seconds: 151
  last_run: "2026-08-16"
  notes: "Live execution of the real ART command (sudo cat /etc/shadow > /tmp/T1003.008.txt; cat /tmp/T1003.008.txt) against sentinel-wazuh. Fired 4 times for this single atomic test, not once — the rule has no image filter (unlike the other Linux rules), so it correctly caught every process in the sudo privilege-escalation chain (the outer shell, sudo itself, and the sudo-exec'd cat) that referenced /etc/shadow on its command line. This is a real difference from Windows process-creation telemetry (1 user action = 1 event there): auditd captures every execve in a privilege-boundary chain, so one logical attacker action can legitimately produce multiple real alerts. mttd_seconds measured from the first of the four (command executed 20:15:19Z, first alert start 20:17:50Z). Negative control (cat /etc/passwd) did not trigger a false positive."

